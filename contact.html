<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — Daniel Rex Forster</title><meta name="description" content="Contact Daniel Rex Forster."><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><a class="brand" href="index.html"><img src="daniel-rex-forster-header-charcoal.png" alt="Daniel Rex Forster"></a><nav><a href="stories/">Stories</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></header><main class="page"><h1>Contact</h1><p>For enquiries, please use the form below:</p><form class="contact-form" action="https://formspree.io/f/mgavjdkq" method="POST"><label>Name</label><input name="name"><label>Email</label><input type="email" name="email"><label>Message</label><textarea name="message"></textarea><button type="submit">Send</button></form></main><footer>© <span id="year"></span> Daniel Rex Forster</footer><script>
const form = document.querySelector('.contact-form');
document.getElementById('year').textContent = new Date().getFullYear();
form.addEventListener('submit', async function (event) {
  event.preventDefault();

  const response = await fetch(form.action, {
    method: 'POST',
    body: new FormData(form),
    headers: { 'Accept': 'application/json' }
  });

  if (response.ok) {
    window.location.href = 'thanks.html';
  }
});
</script></body></html>
